name: Gemini CLI Assistant

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: gemini-assistant-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  run-gemini:
    if: >-
      contains(github.event.comment.body, '@gemini-cli') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gemini CLI
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            저장소 루트의 GEMINI.md 규칙을 반드시 먼저 읽고 따르세요.

            환경 변수 ISSUE_NUMBER, ISSUE_TITLE, COMMENT_BODY에 현재 GitHub 이슈/댓글 요청이 들어 있습니다.
            먼저 환경 변수 값을 확인한 뒤 아래 절차대로 처리하세요:
            1. 요청 내용을 분석하고 필요한 파일만 수정하세요. (단순 질문·확인 요청이면 파일 수정 없이 답변만 남기세요.)
            2. 코드 수정 시 JSON/JS 문법 오류나 기존 기능 손상이 없는지 검증하세요.
            3. 코드 변경이 있으면 `gemini/issue-${ISSUE_NUMBER}` 브랜치를 만들어 커밋·푸시하고,
               `gh pr create`로 변경 요약이 포함된 Pull Request를 생성하세요.
            4. 최종 결과(답변 또는 PR 링크)를 `gh issue comment "$ISSUE_NUMBER" --body "..."` 명령으로 한국어 댓글을 남기세요.
